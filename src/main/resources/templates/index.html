<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet">
    <title>Login - NexumBank</title>
</head>

<body class="bg-light">
<header class="header">
    <div class="container-fluid px-5">
        <div class="row align-items-center">
            <div class="col-auto">
                <div class="logo">
                    <img src="../static/images/logo.png" alt="Logo" class="img-fluid">
                </div>
            </div>
            <div class="col text-end">
                <div class="contadigital">
                    <h3 class="text-white mb-0" style="font-weight: bold; font-size: 30px;">
                        conta<span class="fw-light">digital</span>
                    </h3>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="container-fluid d-flex align-items-center justify-content-center"
     style="min-height: calc(100vh - 120px); padding-top: 2rem; padding-bottom: 2rem;">
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="login-icon mb-3">
                            <i class="bi bi-person-circle text-primary" style="font-size: 3rem;"></i>
                        </div>
                        <h2 class="card-title fw-bold text-dark mb-0">Bem-vindo</h2>
                        <p class="text-muted mb-4">Faça <em>login</em> para acessar a sua conta</p>
                    </div>

                    <form action="" method="POST" novalidate>
                        <div class="mb-4">
                            <label for="cpf" class="form-label fw-semibold text-dark">
                                <i class="bi bi-person-badge me-2"></i>CPF/CNPJ
                            </label>
                            <input type="text"
                                   class="form-control form-control-lg rounded-3 border-2"
                                   id="cpf"
                                   name="cpf"
                                   placeholder="Digite seu CPF ou CNPJ"
                                   required>
                            <div class="invalid-feedback">
                                Por favor, insira um CPF/CNPJ válido.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label fw-semibold text-dark">
                                <i class="bi bi-lock me-2"></i>Senha
                            </label>
                            <div class="input-group">
                                <input type="password"
                                       class="form-control form-control-lg rounded-start-3 border-2"
                                       id="senha"
                                       name="senha"
                                       placeholder="Digite sua senha"
                                       required>
                                <button class="btn btn-outline-secondary rounded-end-3 border-2"
                                        type="button"
                                        id="togglePassword">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback">
                                Por favor, insira a sua senha.
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <a href="#" class="text-decoration-none text-primary fw-medium">
                                <i class="bi bi-question-circle me-1"></i>Esqueci a senha
                            </a>
                            <a href="cadastro.html" class="text-decoration-none text-success fw-medium">
                                <i class="bi bi-person-plus me-1"></i>Criar conta
                            </a>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-semibold py-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>ENTRAR
                            </button>
                        </div>
                    </form>

                    <div class="text-center my-4">
                        <hr class="my-3">
                        <small class="text-muted bg-light px-3">ou continue com</small>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" class="btn btn-outline-dark w-100 rounded-3">
                                <i class="bi bi-google me-2"></i>Google
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-outline-primary w-100 rounded-3">
                                <i class="bi bi-facebook me-2"></i>Facebook
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <small class="text-muted">
                    <i class="bi bi-shield-check me-1"></i>
                    Seus dados estão protegidos com criptografia de ponta a ponta
                </small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

<script src="../static/js/login.js"></script>

</body>

</html>
